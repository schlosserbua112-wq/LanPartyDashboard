<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN-Party-Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="display">
  <header class="topbar">
    <h1 id="eventName">LAN-Party</h1>
    <div class="now-playing" id="nowPlaying" hidden>
      <img class="np-cover" id="npCover" alt="">
      <div class="np-text">
        <strong id="npTitle"></strong>
        <small id="npArtist"></small>
        <span class="np-progress"><span id="npProgress"></span></span>
      </div>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </div>
    <div class="wifi" id="wifi"></div>
    <div class="user-bar" id="userBar" hidden>
      <span>Hallo <strong id="username"></strong></span>
      <nav class="mode-switch" id="modeSwitch" aria-label="Modus" hidden>
        <a href="/admin">Admin-Modus</a>
        <a href="/" class="active" aria-current="page">Nutzermodus</a>
      </nav>
      <a href="/logout" id="logout">Abmelden</a>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <main class="grid">
    <section class="card" id="scheduleCard">
      <h2>Zeitplan</h2>
      <ol class="schedule" id="schedule"></ol>
    </section>

    <section class="card wheel-card" id="wheelCard">
      <h2>Glücksrad <small id="wheelOpen"></small></h2>
      <div class="wheel-body">
        <div class="wheel-main">
          <div class="wheel-wrap"><canvas id="wheel"></canvas></div>
          <p class="wheel-status" id="wheelStatus"></p>
        </div>
        <!-- Nur für angemeldete Nutzer sichtbar -->
        <div class="wheel-side" id="wheelSide" hidden>
          <button id="spinBtn" class="spin-btn" hidden title="Leertaste">Drehen!</button>
          <form id="entryForm" class="row" hidden>
            <input name="text" maxlength="40" placeholder="Neuer Eintrag fürs Rad" required>
            <button>Hinzufügen</button>
          </form>
          <p class="muted" id="closedHint" hidden>Die Eingabe ist geschlossen.</p>
          <p class="error" id="wheelError"></p>
          <h3 class="side-title">Einträge <small id="entryCount"></small></h3>
          <ul class="items scroll" id="entries"></ul>
        </div>
      </div>
    </section>

    <section class="card" id="featuresCard" hidden>
      <h2>Deine Features</h2>
      <ul class="feature-list" id="features"></ul>
    </section>

    <section class="card" id="leaderboardCard">
      <h2>Rangliste</h2>
      <ol class="leaderboard" id="leaderboard"></ol>
    </section>

    <section class="card" id="votesCard">
      <h2>Abstimmungen</h2>
      <div class="polls" id="polls"></div>
    </section>

    <!-- Nur für Nutzer mit dem Feature „Musik“ -->
    <section class="card music-card" id="musicCard" hidden>
      <h2>Musik <small id="musicAccount"></small></h2>
      <div class="music-body">
        <div class="music-now" id="musicNow"></div>
        <div class="music-queue">
          <h3 class="side-title">Als Nächstes</h3>
          <ol class="queue scroll" id="musicQueue"></ol>
        </div>
        <div class="music-search">
          <h3 class="side-title">Song wünschen <small id="wishHint"></small></h3>
          <form id="musicSearch" class="row">
            <input name="q" maxlength="100" placeholder="Titel oder Künstler suchen" autocomplete="off" required>
            <button>Suchen</button>
          </form>
          <p class="error" id="musicError"></p>
          <ul class="results scroll" id="musicResults"></ul>
        </div>
      </div>
    </section>

    <section class="card" id="serversCard">
      <h2>Server</h2>
      <ul class="servers" id="servers"></ul>
    </section>
  </main>

  <p class="toast" id="toast" hidden></p>
  <div class="music-toast" id="musicToast" hidden></div>

  <footer class="ticker"><span id="ticker"></span><span class="conn" id="conn"></span></footer>

  <script src="/common.js"></script>
  <script src="/wheel.js"></script>
  <script src="/music.js"></script>
  <script src="/display.js"></script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abstimmen</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page">
  <main class="narrow">
    <h1>Was spielen wir als Nächstes?</h1>
    <p class="muted">Tippe auf ein Spiel. Du kannst deine Stimme jederzeit ändern.</p>
    <ul class="vote-list" id="games"></ul>
    <button class="secondary" id="clear" hidden>Stimme zurückziehen</button>
  </main>

  <script src="/common.js"></script>
  <script>
    'use strict';
    // Jedes Gerät bekommt eine zufällige ID, damit pro Gerät eine Stimme zählt.
    let clientId = null;
    try { clientId = localStorage.getItem('lanparty-client'); } catch {}
    if (!clientId) {
      clientId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
      try { localStorage.setItem('lanparty-client', clientId); } catch {}
    }

    let myVote = null;
    let state = null;

    async function vote(gameId) {
      await fetch('/api/vote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clientId, gameId }),
      });
      myVote = gameId;
      render();
    }

    function render() {
      if (!state) return;
      const list = document.getElementById('games');
      list.innerHTML = state.games.length
        ? state.games.map((g) => `<li><button data-id="${esc(g.id)}" class="${g.id === myVote ? 'chosen' : ''}"><span>${esc(g.name)}</span><span class="count">${g.votes}</span></button></li>`).join('')
        : '<li class="empty">Gerade steht nichts zur Wahl.</li>';
      document.getElementById('clear').hidden = !myVote;
    }

    document.getElementById('games').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-id]');
      if (btn) vote(btn.dataset.id);
    });
    document.getElementById('clear').addEventListener('click', () => vote(null));

    fetch('/api/vote?clientId=' + encodeURIComponent(clientId))
      .then((r) => r.json())
      .then((r) => { myVote = r.gameId; render(); });

    subscribe((s) => {
      state = s;
      if (myVote && !s.games.some((g) => g.id === myVote)) myVote = null;
      render();
    });
  </script>
</body>
</html>

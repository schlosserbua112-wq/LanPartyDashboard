services:
  dashboard:
    build: .
    container_name: lanparty-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-bitte-aendern}
    volumes:
      - ./data:/data
    # Begrenzt den Speicher, damit auf kleinen Pis genug für den Rest bleibt.
    mem_limit: 128m
